name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install and start PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql postgresql-client
          sudo systemctl start postgresql
          db_password="$(openssl rand -hex 32)"
          jwt_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$db_password"
          echo "::add-mask::$jwt_secret"
          echo "DATABASE_URL=postgresql://saas_pos_ci:${db_password}@localhost:5432/saas_pos_test?schema=public" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          sudo -u postgres psql --command="CREATE USER saas_pos_ci WITH PASSWORD '${db_password}';"
          sudo -u postgres createdb --owner=saas_pos_ci saas_pos_test
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run migrate:deploy && npm run migrate:status
      - run: npm run db:seed
      - run: npm --workspace apps/api run docs:api
      - name: Verify committed OpenAPI specification
        run: git diff --exit-code -- documentations/api/openapi.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, security-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build
