name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: saas_pos
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 242622
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:242622@localhost:5432/saas_pos?schema=public
      - run: npm run db:seed
        env:
          DATABASE_URL: postgresql://postgres:242622@localhost:5432/saas_pos?schema=public
      - run: npm run test
        env:
          DATABASE_URL: postgresql://postgres:242622@localhost:5432/saas_pos?schema=public
          JWT_SECRET: ci-test-secret-with-at-least-32-characters

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
